name: Suggest a paper
description: Recommend a relevant paper for the reading list
title: "[Paper] "
body:
  - type: input
    id: paper_title
    attributes:
      label: Paper title
      description: Use the exact title from the paper.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Paper or official project URL
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors
    validations:
      required: true
  - type: input
    id: publication
    attributes:
      label: Venue and year
      placeholder: CVPR 2026 or arXiv 2026
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Main category
      options:
        - World Models and Simulation
        - Video Understanding and Reasoning
        - Video Generation and Editing
        - Unified Multimodal Models
        - Datasets, Benchmarks and Evaluation
        - Surveys and Foundations
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution and relevance
      description: Briefly explain the contribution and why it belongs in the list.
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I searched the current list and did not find this work.
          required: true
        - label: The metadata matches an authoritative source.
          required: true
