name: Suggest a paper
description: Recommend a relevant paper for the reading list
title: "[Paper] "
body:
  - type: input
    id: paper_title
    attributes:
      label: Paper title
      description: Use the exact title from the paper.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Paper or official project URL
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: resource_urls
    attributes:
      label: Official code, project, or dataset links (optional)
      description: Include author-maintained resources for this exact paper/version; omit unavailable links.
  - type: input
    id: authors
    attributes:
      label: Authors
    validations:
      required: true
  - type: input
    id: publication
    attributes:
      label: Venue and year
      placeholder: CVPR 2026 or arXiv 2026
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Main category
      options:
        - Reading the World (video comprehension)
        - Writing the World (video generation)
        - Sharing the World (unified video models)
        - Interacting with the World (video world models)
        - Datasets, Benchmarks and Evaluation
        - Surveys and Foundations
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution and relevance
      description: Briefly explain the contribution and why it belongs in the list.
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I searched the current list and did not find this work.
          required: true
        - label: The metadata matches an authoritative source.
          required: true
